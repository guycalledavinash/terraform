name: Terraform validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Check Terraform formatting
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - airbnb-infra-spoof/environments/dev
          - infra-demo-aug-10
          - sample-infra-fifa
          - sample-infra/test-5-apr-25
          - terraform-basic
    env:
      TF_IN_AUTOMATION: "true"
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Initialize Terraform
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate


  security-scan:
    name: Check Terraform security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov==3.4.0

      - name: Scan modular AWS infrastructure
        id: checkov
        continue-on-error: true
        run: >-
          checkov
          --directory airbnb-infra-spoof
          --framework terraform
          --output json
          --output-file-path checkov-report

      - name: Summarize findings
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("checkov-report/results_json.json")
          if not report_path.exists():
              print("Checkov did not produce a JSON report.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          lines = [
              "## Checkov security scan",
              "",
              f"Passed: {summary.get('passed', 0)}; "
              f"failed: {summary.get('failed', 0)}; "
              f"parsing errors: {summary.get('parsing_errors', 0)}.",
              "",
              "| Severity | Check | Resource | File / lines |",
              "| --- | --- | --- | --- |",
          ]
          for finding in report.get("results", {}).get("failed_checks", []):
              severity = finding.get("severity") or "Unclassified"
              resource = finding.get("resource") or "unknown"
              location = finding.get("repo_file_path") or finding.get("file_path") or "unknown"
              line_range = finding.get("file_line_range") or []
              if line_range:
                  location += ":" + "-".join(str(line) for line in line_range)
              lines.append(
                  f"| {severity} | {finding.get('check_id', 'unknown')} "
                  f"— {finding.get('check_name', 'unknown')} | "
                  f"{resource} | {location} |"
              )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload Checkov JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-report/results_json.json
          if-no-files-found: warn
